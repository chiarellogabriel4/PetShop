<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configurar administração | helpPatas</title><link rel="stylesheet" href="admin.css"><script src="api.js" defer></script><script src="setup.js" defer></script></head>
<body><main style="margin:0;max-width:560px;padding:48px 20px;margin-inline:auto"><a class="brand" href="index.html">🐾 helpPatas</a><section class="panel" style="margin-top:32px;padding:28px"><span class="eyebrow">PRIMEIRO ACESSO</span><h1>Seu petshop, sob seu controle.</h1><p>Crie sua conta administrativa. Esta configuração funciona uma única vez, com o link privado exibido no terminal do servidor.</p><form id="setupForm"><div class="form-grid"><label class="full">Seu nome<input name="name" required maxlength="100" autocomplete="given-name"></label><label class="full">E-mail<input name="email" type="email" required maxlength="160" autocomplete="email"></label><label class="full">Senha (mínimo de 10 caracteres)<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><label class="full">Confirme a senha<input name="confirmPassword" type="password" required minlength="10" autocomplete="new-password"></label></div><p id="setupMessage" role="status" style="margin-top:16px"></p><button class="primary" type="submit">Criar minha conta administrativa</button></form></section></main></body></html>
